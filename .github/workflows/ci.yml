name: CI

# THE DUALITY: this GitHub CI covers the backward-compat range — python 3.10–3.13, the "lower
# models" — while the latest python (3.14, the version the live deployment runs) is covered
# upstream before publish. Older here, latest upstream: no version is tested twice, and neither
# side runs the whole matrix. GitHub-native checks (CodeQL, Scorecard, the OIDC PyPI publish)
# also live here.
on:
  push:
    branches: [main]
  pull_request:
  # DAILY — same law proximo learned 2026-08-08: a blocking gate only blocks
  # when it RUNS, and push-only triggers leave a quiet main unexamined. The
  # pip-audit job below watches pins that CVEs are disclosed against without
  # any push happening here, and the ref-audit job watches standing refs no
  # push ever re-scans. Slot picked clear of proximo's 06:13.
  schedule:
    - cron: "47 6 * * *"   # daily, 06:47 UTC
  # Manual re-run for commits whose push CI missed (forge outage precedent).
  workflow_dispatch:

# Explicit read-only floor.
permissions:
  contents: read

jobs:
  broker-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install broker (with the MCP + A2A doors) + pytest
        working-directory: broker
        run: python -m pip install -e '.[server,a2a]' pytest
      - name: Test broker
        working-directory: broker
        run: python -m pytest pacioli/tests -q -ra

  guard-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install guard (pure decision logic, zero deps) + pytest
        working-directory: guard
        run: python -m pip install -e . pytest
      - name: Test guard
        working-directory: guard
        run: python -m pytest pacioli_guard/tests -q -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (config in ruff.toml — repo-root, covers broker/ + guard/)
        run: ruff check .

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"   # version_tools uses tomllib (stdlib >=3.11)
      - name: Version drift gate (single-source across broker + guard)
        run: python scripts/version_tools.py check
      - name: Version-tools unit + drift tests
        run: |
          python -m pip install pytest
          python -m pytest scripts/tests -q -ra

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit the broker [server,a2a] dependency closure (pure cores have no deps)
        working-directory: broker
        run: |
          python -m pip install -e '.[server,a2a]'
          # Freeze the closure BEFORE pip-audit's own deps land, and drop the editable self.
          python -m pip freeze | grep -vE '^-e |pacioli' > deps.txt
          python -m pip install pip-audit
          pip-audit -r deps.txt

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so gitleaks scans commits, not just the tree
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        # Free for individual accounts. GITHUB_TOKEN is required to scan pull requests.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every public ref must stay curated — the invariant proximo's tag v0.24.0
  # broke silently in July (592 uncurated commits public via ONE tag, found
  # 2026-08-09 by the first full-history scheduled scan). Public main here is
  # the same curated fast-forward pattern, so the same net: walk EVERY branch
  # and tag daily, red if any strays off main or carries an internal-only
  # path. The local pre-push guard blocks the class at the muzzle; this is
  # the daily proof no ref got past it.
  ref-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # all branches + tags — standing refs are the audit surface
      - name: Every public ref is an ancestor of main, or tiny and clean
        run: |
          set -euo pipefail
          main=$(git rev-parse origin/main)
          deny='^(\.gitea/|\.scratch/|docs/internal/|deploy/bench/)|(^|/)docs/plans/|(^|/)(CLAUDE|CULTURE|GO-LIVE|RESEARCH-VERDICT|DISTRIBUTION|COMPETITORS|DESIGN)\.md$'
          # deploy/bench/receipts.sh is the ONE publishable file in an otherwise
          # internal directory (fully parameterised; same carve-out as the
          # leak-audit's KEEP_PATHS). It lives on public main, so without this
          # exemption every main+1 PR branch would false-red daily.
          keep='deploy/bench/receipts.sh'
          fail=0
          refs=0
          offmain=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags \
                       | grep -v '^refs/remotes/origin/HEAD$'); do
            refs=$((refs + 1))
            tip=$(git rev-parse "$ref^{commit}")
            n=$(git rev-list --count "$main..$tip")
            [ "$n" -eq 0 ] && continue
            offmain=$((offmain + n))
            if [ "$n" -gt 25 ]; then
              echo "::error::$ref exposes $n commits not on main — uncurated history reachable"
              fail=1
              continue
            fi
            for c in $(git rev-list "$main..$tip"); do
              hits=$(git ls-tree -r "$c" --name-only | grep -vxF "$keep" | grep -cE "$deny" || true)
              if [ "$hits" -gt 0 ]; then
                echo "::error::$ref commit $c carries $hits internal-only path(s)"
                fail=1
              fi
            done
          done
          tags=$(git for-each-ref --format='%(refname)' refs/tags | wc -l)
          echo "audited $refs public ref(s), $tags of them tags; $offmain commit(s) reachable off main"
          # A silent pass over an empty ref list reads EXACTLY like a clean audit: same
          # line, same exit 0. What leaked from proximo in July was a TAG, so a run that
          # fetched no tags proves nothing and must not report a clean surface.
          if [ "$refs" -lt 2 ] || [ "$tags" -lt 1 ]; then
            echo "::error::ref-audit saw $refs ref(s) and $tags tag(s) — the ref list is empty or unfetched, so this scan proves nothing"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "every public ref is curated: on main, or ≤25 clean commits ahead"
          exit "$fail"
