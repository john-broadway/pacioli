name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"   # weekly, Monday 03:27 UTC
  # Dispatchable so a release lane can prove CodeQL on the curated tree BEFORE public main
  # moves (the C-lane staging PR triggers it via pull_request; dispatch covers any other
  # ref), alongside ci.yml (proximo's codeql has this; scorecard structurally cannot).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload findings to the repo Security tab
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml   # scan the shipped packages only
      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
