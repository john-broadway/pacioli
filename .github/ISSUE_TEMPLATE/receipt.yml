name: Receipt from `pacioli doctor --receipt`
description: Paste a receipt. It is redacted before it is written, and you chose to send it.
title: "receipt: "
labels: ["receipt"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sending this. It is the only way we find out what the software actually does
        in rooms we cannot see.

        **Generate one with:**

        ```
        pacioli doctor --receipt > receipt.txt
        ```

        Hostnames, IP addresses, user identifiers and credential paths are removed before the file
        is written. Read it first anyway — it is your machine and your call, and we would rather you
        checked than trusted us about it.

        If what you are reporting is a **security** defect, do not open an issue. Use private
        vulnerability reporting on the Security tab, per `SECURITY.md`.

  - type: textarea
    id: receipt
    attributes:
      label: The receipt
      description: Paste it whole, including the header and fingerprint.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: >
        The single most useful thing you can add. A refusal we intended and a refusal we did not
        look identical from the inside; only you know which one you were trying to do.
    validations:
      required: true

  - type: input
    id: erpnext
    attributes:
      label: ERPNext / Frappe version
      placeholder: "v16"
    validations:
      required: false

  - type: checkboxes
    id: read
    attributes:
      label: Before you send
      options:
        - label: I read the receipt and I am content for its contents to be public.
          required: true
