# THE JUDGEMENT beside the vendor's table. A person writes this file; a script writes the table.
#
# [served.<Doctype>]  how the spine governs this doctype: the party, date and amount fields a PLAN
#                     reads (null where the vendor has none), the verb that submits it, and a why.
# [held.<Doctype>]    the door refuses submit/cancel/amend with this sentence. `ask = true` marks a
#                     sentence Claude wrote on 2026-10-10 from the vendor's doctype definitions and
#                     ERPNext's documented behaviour; John's ruling replaces it or drops the flag.
#
# Every submittable doctype the vendor publishes is in exactly one of the two tables, or the
# coverage receipt (`scripts/vendor_meta.py coverage`) goes red and the door refuses it as
# unjudged. Editing this file IS the act of granting. Reads (get, list) are not judged here: the
# seat's scope on the floor governs them.
#
# The 51 served rows were carried from `pacioli/erpnext.py` SUPPORTED_DOCTYPES on 2026-10-10 and a
# test holds the two equal until the Python table goes. The why on each is the one-line reason the
# spine governs that document; the long per-doctype dossiers stay in erpnext.py's prose until they
# move to docs.

